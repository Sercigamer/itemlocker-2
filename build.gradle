plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Die Minecraft-Version gehoert in den Jar-Namen, sonst weiss beim Herunterladen
// niemand, wofuer die Datei ist. Alles nach dem Plus ist SemVer-Metadaten -
// Fabric akzeptiert das und mod_version bleibt fuer den Tag-Vergleich sauber.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom fuegt die Minecraft-/Fabric-Repositories selbst hinzu.
	maven {
		name = 'TerraformersMC'
		url = uri('https://maven.terraformersmc.com/releases/')
	}
}

loom {
	runs {
		client {
			// Prueft beim Start, ob die Mixins wirklich angewendet wurden.
			property 'itemlocker.selftest', 'true'
			// Ohne das laeuft der Client im Produktions-Namensraum (official),
			// waehrend Loom die Mods nach named remappt - der Loader bricht dann
			// beim Lesen der Class-Tweaker ab.
			property 'fabric.development', 'true'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Ab 26.x liefert Mojang das Spiel unverschleiert aus, es gibt also nichts
	// zu uebersetzen. Fabric veroeffentlicht dafuer nur eine leere Huelle, die
	// sich selbst als Version 0.0.0 deklariert - ueber Maven ist sie deshalb
	// nicht aufloesbar. Daher liegt sie als Datei im Projekt.
	mappings files("gradle/mappings/identity-${project.minecraft_version}.jar")
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Nur die vier tatsaechlich genutzten Module statt der kompletten API.
	// Die Sammel-Abhaengigkeit zieht unter anderem fabric-gametest-api-v1 mit,
	// dessen Class-Tweaker im Namensraum "named" liegt - bei 26.x laeuft die
	// Laufzeit aber auf "official", und der Loader bricht deshalb ab.
	// Nur zum Kompilieren. Zur Laufzeit wird die unveraenderte Fabric API aus
	// run/mods geladen: Sie liegt bereits im Namensraum "official", genau wie
	// die Laufzeit bei 26.x. Wuerde Loom sie einbinden, remappte er sie nach
	// "named" - einen Namensraum, den es in 26.x nicht mehr gibt, woraufhin der
	// Loader beim Lesen der Class-Tweaker abbricht.
	Set.of("fabric-command-api-v2", "fabric-key-mapping-api-v1", "fabric-lifecycle-events-v1",
			"fabric-rendering-v1").each {
		modCompileOnly fabricApi.module(it, project.fabric_version)
	}

	// Mod Menu ist optional: nur zum Kompilieren und im Dev-Client vorhanden,
	// wird nicht mitgeliefert und nicht vorausgesetzt.
	// Nur zum Kompilieren. Im Dev-Client wuerde Loom die von Mod Menu
	// gebuendelten Fabric-Module nach "named" remappen - denselben Konflikt wie
	// oben. Zum Testen der Mod-Menu-Anbindung die Jar von Hand nach run/mods
	// legen.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'github_user', project.github_user
	inputs.property 'github_repo', project.github_repo
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'java_version', project.java_version

	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version,
				'github_user': inputs.properties.github_user,
				'github_repo': inputs.properties.github_repo,
				'minecraft_version': inputs.properties.minecraft_version,
				'java_version': inputs.properties.java_version
	}
}

// Gleiche Eingabe soll das gleiche Jar ergeben - erleichtert das Vergleichen
// von Builds und vermeidet unnoetige Unterschiede zwischen Rechner und CI.
tasks.withType(AbstractArchiveTask).configureEach {
	it.preserveFileTimestamps = false
	it.reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
	it.options.encoding = 'UTF-8'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
	}

	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
