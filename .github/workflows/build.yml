name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java-Version aus gradle.properties lesen
        run: |
          JV=$(grep -E '^java_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "JAVA_VERSION=${JV:-21}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: itemlocker-dev-build
          path: build/libs/*.jar
          if-no-files-found: error
