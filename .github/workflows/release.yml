name: Release

# Baut die Mod und haengt das fertige Jar an ein GitHub-Release,
# sobald ein Tag wie v1.2.0 gepusht wird.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Platzhalter pruefen
        run: |
          USER=$(grep -E '^github_user=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [ "$USER" = "YOUR-GITHUB-NAME" ]; then
            echo "::error::github_user in gradle.properties steht noch auf dem Platzhalter."
            exit 1
          fi

      - name: Tag gegen mod_version pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu mod_version=$VERSION"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Release-Jar einsammeln
        run: |
          mkdir -p release
          cp build/libs/*.jar release/
          # Das Sources-Jar gehoert nicht in den mods-Ordner - sonst laedt es
          # jemand versehentlich statt der Mod herunter.
          rm -f release/*-sources.jar
          ls -l release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
