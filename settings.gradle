pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = uri('https://maven.fabricmc.net/')
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Laedt automatisch ein JDK 21 herunter, falls keins installiert ist.
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'itemlocker'
