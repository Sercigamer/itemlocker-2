# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft / Fabric (siehe https://fabricmc.net/develop)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19

# Ab 26.x liefert Mojang das Spiel unverschleiert aus - es gibt weder Yarn
# noch Mojang-Mappings, weil keine mehr noetig sind. Die Klassen heissen im
# Jar bereits so, wie wir sie im Code schreiben.
java_version=25

# Mod
mod_version=1.4.1
maven_group=com.itemlocker
archives_base_name=itemlocker

# GitHub-Benutzer und Repo-Name. Landen beim Bauen automatisch als Autor und
# als Repo-Links in fabric.mod.json - die einzigen Stellen, die du anpassen
# musst, wenn das Repo mal umzieht oder umbenannt wird.
github_user=Sercigamer
github_repo=itemlocker-2

# Dependencies
fabric_version=0.157.0+26.2
modmenu_version=20.0.0
